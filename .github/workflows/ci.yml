name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Node 24 required so oxlint.config.ts / oxfmt.config.ts TS configs load
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install documentation dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Verify generated artefacts are deterministic
        run: bun run verify:generation

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint:code

      - name: Format check
        run: bun run fmt:check

      - name: Test
        run: bun run test

      - name: Build package
        run: bun run build

      - name: Check package contents and types
        run: bun run lint

      - name: Smoke test packed consumer
        run: bun run smoke:packed-consumer

      - name: Check API documentation
        run: bun run docs:api:check

      - name: Build documentation site
        run: bun run docs:build
